name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pozwól tylko jednemu deployowi naraz; nie przerywaj trwającego
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Project site jest serwowany z https://<user>.github.io/<repo>/,
      # więc base-href musi wskazywać na /<repo>/
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Wyłącz przetwarzanie Jekyll (pliki/foldery z "_" są inaczej pomijane)
      - run: touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
